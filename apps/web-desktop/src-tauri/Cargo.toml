[package]
name = "server-guardian-desktop"
version = "0.1.0"
description = "Server Guardian - Intelligent SSH & Node Fleet Manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
# Native folder picker for the export folder; opened from Rust only (docs/design/desktop-export.md).
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# AGENT_TOKEN lives in the OS credential store (macOS Keychain, Windows Credential Manager,
# Linux kernel keyutils), never in the WebView's localStorage.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
