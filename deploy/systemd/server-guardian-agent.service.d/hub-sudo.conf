# Hub sudo option (scripts/install-agent-service.sh --hub-sudo, the hub default).
# Lifts the parts of the agent sandbox that stop sudo from working, so judge actions and the
# dashboard terminal can run sudo on the hub. The key and secret paths stay hidden from plain
# reads, but any root process can still reach them; the fleet key protection is then a guard
# against accidents, not a security boundary. Remove with --no-hub-sudo.
[Service]
NoNewPrivileges=no
RestrictSUIDSGID=no
CapabilityBoundingSet=~
ProtectSystem=no
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
RestrictAddressFamilies=
Environment=GUARDIAN_HUB_SUDO=on
